<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/admin/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Oncourt platform administration.">
  <meta name="robots" content="noindex, nofollow">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Oncourt Admin">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Oncourt Admin</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; height: 100%; background: #f5f8f9; }
    #loading {
      position: fixed; inset: 0; padding: 0 24px;
      display: flex; flex-direction: column; gap: 6px;
      align-items: center; justify-content: center; text-align: center;
      color: #061c27;
      font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    #loading i {
      width: 34px; height: 34px; margin-bottom: 12px; border-radius: 50%;
      border: 3px solid #e1e9ec; border-top-color: #13c8d3;
      animation: loading 1s linear infinite;
    }
    #loading small { color: #5e737c; font-size: 14px; }
    @keyframes loading { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      #loading i { animation: none; }
    }
  </style>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <!-- The app takes a while on a first visit: say so instead of a white page.
       It sits under the app, so the app shows even if the event never comes. -->
  <div id="loading" role="status">
    <i aria-hidden="true"></i>
    Loading Oncourt Admin…
    <small>The first visit can take up to a minute.</small>
  </div>
  <script>
    addEventListener('flutter-first-frame', function () {
      document.getElementById('loading').remove();
    }, { once: true });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
