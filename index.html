<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Oncourt Lebanon</title>
  <meta name="description" content="Book courts, join matches and play with friends across Lebanon.">
  <style>
    :root { --ink: #0a1f29; --teal: #14c8d2; --muted: #5d7480; --bg: #f3f7f8; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg);
           color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { width: min(460px, calc(100% - 32px)); text-align: center; }
    .logo { font-weight: 900; font-size: 40px; letter-spacing: -1px; }
    .logo span { color: var(--teal); }
    p { color: var(--muted); }
  </style>
</head>
<body>
<main>
  <div class="logo"><span>On</span>court</div>
  <p>Book padel, football, basketball, tennis and volleyball courts, join matches
     and play with friends across Lebanon. Pay at the club.</p>
  <p>The Oncourt app for Android is coming soon.</p>
</main>
</body>
</html>
