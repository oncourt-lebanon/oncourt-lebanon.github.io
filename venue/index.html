<!DOCTYPE html>
<html>
<head>
  <base href="/venue/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Oncourt venue operations dashboard">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101214">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>Oncourt Venue</title>
  <style>
    html, body { margin: 0; height: 100%; background: #f5f8f9; }
    #loading {
      position: fixed; inset: 0; padding: 0 24px;
      display: flex; flex-direction: column; gap: 6px;
      align-items: center; justify-content: center; text-align: center;
      color: #061c27;
      font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    #loading i {
      width: 34px; height: 34px; margin-bottom: 12px; border-radius: 50%;
      border: 3px solid #e1e9ec; border-top-color: #13c8d3;
      animation: loading 1s linear infinite;
    }
    #loading small { color: #5e737c; font-size: 14px; }
    @keyframes loading { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      #loading i { animation: none; }
    }
  </style>
</head>
<body>
  <!-- The app takes a while on a first visit: say so instead of a white page.
       It sits under the app, so the app shows even if the event never comes. -->
  <div id="loading" role="status">
    <i aria-hidden="true"></i>
    Loading Oncourt Venue…
    <small>The first visit can take up to a minute.</small>
  </div>
  <script>
    addEventListener('flutter-first-frame', function () {
      document.getElementById('loading').remove();
    }, { once: true });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
