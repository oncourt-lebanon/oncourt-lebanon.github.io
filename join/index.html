<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Join on Oncourt</title>
  <meta name="description" content="Open this match, tournament or team in the Oncourt app.">
  <meta name="robots" content="noindex">
  <style>
    :root { --ink: #0a1f29; --teal: #14c8d2; --muted: #5d7480; --bg: #f3f7f8; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center;
           background: var(--bg); color: var(--ink);
           font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { width: min(420px, calc(100% - 32px)); background: #fff; border-radius: 24px;
           padding: 32px 24px; text-align: center; box-shadow: 0 10px 30px rgba(10,31,41,.08); }
    h1 { font-size: 26px; margin: 12px 0 8px; }
    p { color: var(--muted); margin: 0 0 20px; }
    .logo { font-weight: 900; font-size: 30px; letter-spacing: -.5px; }
    .logo span { color: var(--teal); }
    a.button { display: block; padding: 16px; border-radius: 16px; background: var(--teal);
               color: var(--ink); font-weight: 800; text-decoration: none; margin-bottom: 12px; }
    .hint { font-size: 14px; }
    .hidden { display: none; }
  </style>
</head>
<body>
<main>
  <div class="logo"><span>On</span>court</div>
  <h1 id="title">You're invited to a match</h1>
  <p id="lead">Open it in the Oncourt app to see the details and join.</p>
  <a id="open" class="button" href="#">Open in Oncourt</a>
  <p id="noapp" class="hint hidden">
    Oncourt isn't on this phone yet. Ask the person who invited you for the
    app, install it, then tap the invite link again.
  </p>
  <p id="desktop" class="hint hidden">
    Open this link on your Android phone with Oncourt installed.
  </p>
</main>
<script>
  (function () {
    var params = new URLSearchParams(location.search);
    var uuid = /^[0-9a-f-]{36}$/i;
    var game = params.get('g') || '';
    var tournament = params.get('t') || '';
    var code = (params.get('c') || '').toUpperCase();
    var open = document.getElementById('open');
    // What to open in the app: a match, a tournament, or a team (its link code).
    var path = '';
    var query = '';
    if (uuid.test(game)) {
      path = 'game/' + game;
      query = '?g=' + game;
    } else if (uuid.test(tournament)) {
      path = 'tournament/' + tournament;
      query = '?t=' + tournament;
      if (/^[A-Z0-9]{8}$/.test(code)) {
        path += '?code=' + code;
        query += '&c=' + code;
        document.getElementById('title').textContent = "You're invited to a team";
        document.getElementById('lead').textContent =
          'Open it in the Oncourt app to join the team and play the tournament.';
      } else {
        document.getElementById('title').textContent = 'A tournament on Oncourt';
        document.getElementById('lead').textContent =
          'Open it in the Oncourt app to see the teams, the draw and the results.';
      }
    }
    if (!path) {
      document.getElementById('lead').textContent = 'This invite link is incomplete. Ask for a new one.';
      open.classList.add('hidden');
      return;
    }
    var appLink = 'app.oncourt://open/' + path;
    var android = /Android/i.test(navigator.userAgent);
    if (params.get('noapp') === '1') {
      document.getElementById('noapp').classList.remove('hidden');
    }
    if (android) {
      var fallback = location.origin + location.pathname + query + '&noapp=1';
      open.href = 'intent://open/' + path +
        '#Intent;scheme=app.oncourt;package=app.oncourt;S.browser_fallback_url=' +
        encodeURIComponent(fallback) + ';end';
      if (params.get('noapp') !== '1') {
        // Try straight away; the button stays for browsers that need a tap.
        setTimeout(function () { location.href = open.href; }, 300);
      }
    } else {
      open.href = appLink;
      document.getElementById('desktop').classList.remove('hidden');
    }
  })();
</script>
</body>
</html>
